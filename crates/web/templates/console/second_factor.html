<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ heading }}</title></head>
<body><main>
<h1>{{ heading }}</h1>
<noscript><p role="note">{{ guidance }}</p></noscript>
<form method="post" action="/console/sign-in/totp">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="target" value="{{ target }}">
  <input type="hidden" name="session" value="{{ session }}">
  <input type="hidden" name="epoch" value="{{ epoch }}">
  <input type="hidden" name="lang" value="{{ lang }}">
  <label>Credential<input name="credential" required></label>
  <label>Revision<input name="credential_revision" type="number" min="0" value="0" required></label>
  <label>{{ code_label }}<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
  <button type="submit">{{ submit }}</button>
</form>
</main></body>
</html>
