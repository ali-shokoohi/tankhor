<!doctype html>
<html lang="{{ html_lang }}" dir="{{ html_dir }}" data-theme="{{ data_theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/console.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
  </head>
  <body class="tk-console">
    <a class="tk-skip-link" href="#main-content">{{ skip_to_main }}</a>
    <header class="tk-shell-header">
      <div class="tk-shell-brand">
        <span class="tk-brand-mark">{{ brand_name }}</span>
      </div>
      <nav class="tk-shell-nav" aria-label="{{ nav_primary_label }}">
        <a class="tk-nav-link" href="/console" aria-current="page">{{ brand_name }}</a>
      </nav>
      <form class="tk-preferences-form" method="post" action="/console/preferences" aria-label="{{ preferences_form_label }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="tk-preference-group">
          <label class="tk-label" for="console-locale-select">{{ language_label }}</label>
          <select class="tk-control" id="console-locale-select" name="lang">
            <option value="fa" {% if is_locale_fa %}selected{% endif %}>{{ language_fa }}</option>
            <option value="en" {% if is_locale_en %}selected{% endif %}>{{ language_en }}</option>
          </select>
        </div>
        <div class="tk-preference-group">
          <label class="tk-label" for="console-theme-select">{{ theme_label }}</label>
          <select class="tk-control" id="console-theme-select" name="theme">
            <option value="light" {% if is_theme_light %}selected{% endif %}>{{ theme_light }}</option>
            <option value="dark" {% if is_theme_dark %}selected{% endif %}>{{ theme_dark }}</option>
            <option value="system" {% if is_theme_system %}selected{% endif %}>{{ theme_system }}</option>
          </select>
        </div>
        <button class="tk-button tk-button-secondary" type="submit">{{ preferences_apply }}</button>
      </form>
    </header>
    <main class="tk-shell-main" id="main-content" tabindex="-1">
      <section class="tk-panel">
        <h1 class="tk-heading-1">{{ heading }}</h1>
        <p class="tk-status-copy">{{ status_message }}</p>
        {% match sample_field %}
        {% when Some with (field) %}
        {% include "partials/field.html" %}
        {% when None %}
        {% endmatch %}
      </section>
    </main>
  </body>
</html>
