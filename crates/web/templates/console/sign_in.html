<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/console.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body class="tk-console">
<main id="main-content" class="tk-shell-main" tabindex="-1">
  <section class="tk-panel">
    <h1>{{ heading }}</h1>
    <p>{{ introduction }}</p>
    <form method="post" action="/console/sign-in/request-code">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="return" value="{{ return_target }}">
      <label for="sign-in-phone">{{ phone_label }}</label>
      <input id="sign-in-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
      <button type="submit">{{ submit }}</button>
    </form>
  </section>
</main>
</body>
</html>
