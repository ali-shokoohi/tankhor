<li class="tk-setting-row" data-setting-key="{{ row.key }}">
  <a class="tk-setting-link" href="/console/settings/{{ row.key }}">{{ row.label }}</a>
  <code class="tk-setting-key">{{ row.key }}</code>
  <span class="tk-setting-value">{{ row.value }}</span>
  <span class="tk-setting-bounds">{{ row.minimum }}..={{ row.maximum }}</span>
  <span class="tk-setting-unit">{{ row.unit }}</span>
</li>
