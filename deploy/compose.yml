name: tankhor-dev

services:
  postgres:
    image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    entrypoint: ["bash", "/opt/tankhor/postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: tankhor_dev_admin
      POSTGRES_DB: tankhor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    ports:
      - "127.0.0.1:5432:5432"
    secrets:
      - postgres_admin
      - postgres_migration
      - postgres_runtime
      - postgres_preparation
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./postgres-entrypoint.sh:/opt/tankhor/postgres-entrypoint.sh:ro
    tmpfs:
      - /run/tankhor-secrets:mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tankhor_dev_admin -d tankhor"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

secrets:
  postgres_admin:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?set protected developer admin password file}
  postgres_migration:
    file: ${POSTGRES_MIGRATION_PASSWORD_FILE:?set protected developer migration password file}
  postgres_runtime:
    file: ${POSTGRES_RUNTIME_PASSWORD_FILE:?set protected developer runtime password file}
  postgres_preparation:
    file: ${POSTGRES_PREPARATION_PASSWORD_FILE:?set protected developer preparation password file}
  minio_root_user:
    file: ${MINIO_ROOT_USER_FILE:?set protected developer MinIO root user file}
  minio_root_password:
    file: ${MINIO_ROOT_PASSWORD_FILE:?set protected developer MinIO root password file}

volumes:
  postgres-data:
  minio-data:
