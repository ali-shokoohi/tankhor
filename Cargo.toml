[workspace]
resolver = "3"
members = ["crates/admin", "crates/app", "crates/infra-auth", "crates/infra-postgres", "crates/infra-sms", "crates/infra-system", "crates/kernel", "crates/testkit", "crates/web"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1"
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
askama_web = { version = "0.16", default-features = false, features = ["axum-0.8"] }
axum = "=0.8.9"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
mockall = "0.15"
proptest = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.29"
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring", "uuid"] }
testcontainers = { version = "=0.27.3", default-features = false, features = ["reusable-containers"] }
testcontainers-modules = { version = "=0.15.0", default-features = false, features = ["postgres"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util", "signal"] }
unic-langid = "0.9"
utoipa = "6.0"
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10.0.2", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1", default-features = false, features = ["serde", "std", "v7"] }
webauthn-rs = { version = "=0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
