[workspace]
resolver = "3"
members = ["crates/kernel", "crates/testkit"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
testcontainers = { version = "=0.27.3", default-features = false, features = ["reusable-containers"] }
testcontainers-modules = { version = "=0.15.0", default-features = false, features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "net", "io-util", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
